<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <script>
    (function () {
      var targetOrigin = "https://yurisa.top";
      var next = targetOrigin + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(next);
    })();
  </script>
</head>
<body>
  <p>Redirecting to the new site...</p>
  <p>
    If you are not redirected, open
    <a href="https://yurisa.top/">https://yurisa.top/</a>.
  </p>
</body>
</html>
