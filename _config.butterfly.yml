# --------------------------------------
# Butterfly 主题配置文件 (v4.12.0)
# 文档: https://butterfly.js.org/
# --------------------------------------



# 导航栏设置
nav:
  logo: /img/pixel-logo.png  # 建议填入一个像素画的小图标
  display_title: true
  fixed: true

# 菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# 代码块设置
highlight_theme: darker
highlight_copy: true
highlight_lang: true
highlight_shrink: false
highlight_height_limit: 400
code_word_wrap: false

# 社交图标
social:
  fab fa-github: https://github.com/yurisachan16-creator || Github || '#24292e'
  fas fa-envelope: mailto:yurisachan16@gmail.com || Email || '#D44638'

# 网站图标
favicon: /img/pixel-logo.png

# 头像设置
avatar:
  img: /img/avatar.jpg
  effect: false

# 禁用顶部图片
disable_top_img: false

# 首页顶部图片 - 设置一张漂亮的Banner图
index_img: /img/pixel-banner.png

# 默认顶部图片
default_top_img: /img/pixel-bg.png

# 归档页顶部图片
archive_img: /img/pixel-bg.png

# 标签页顶部图片
tag_img: /img/pixel-bg.png

# 分类页顶部图片
category_img: /img/pixel-bg.png

# 文章封面设置
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - https://i.loli.net/2020/05/01/gkihqEjXxJ5UZ1C.jpg

# 替换无法显示的图片
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# 404 页面
error_404:
  enable: true
  subtitle: '页面没有找到'
  background: url(/img/pixel-bg.png) repeat

# 文章元数据
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 首页副标题 - 打字机效果
subtitle:
  enable: true
  effect: true
  loop: true
  source: false
  sub:
      - 正在构建我的像素世界 👾
      - Press Start to Continue ▶

# 文章布局
index_layout: 3

# 文章简介
index_post_content:
  method: 2
  length: 500

# 目录设置
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 版权信息
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏
reward:
  enable: false
  QR_code:

# 相关文章
related_post:
  enable: true
  limit: 6
  date_type: created

# 文章分页
post_pagination: 1

# 过期提醒
noticeOutdate:
  enable: false
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文距今已有
  message_next: 天，内容可能已过时。

# 页脚设置
footer:
  owner:
    enable: true
    since: 2025
  custom_text: <p>🎉 欢迎来到 Yurisachan 的小站</p>
  copyright: true

# 侧边栏设置
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 持续发布技术与创作记录的开发者
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/yurisachan16-creator
  card_announcement:
    enable: true
    content: 博客已启用正式版本发布与文章更新记录。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# 右下角按钮
rightside_bottom:

# 繁简转换
translate:
  enable: false

# 阅读模式
readmode: true

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 滚动百分比
rightside_scroll_percent: false

# 锚点
anchor:
  auto_update: false
  click_to_scroll: true

# 复制设置
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 访问统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 搜索设置
local_search:
  enable: true
  preload: false
  CDN:

# 分享
share:
  use: sharejs
  sharejs:
    sites: weibo,qq,wechat

# 主题颜色
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# 圆角
beautify:
  enable: false
  field: site
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#F47466'

# 字体设置 - 像素风
font:
  global-font-size: 16px
  code-font-size: 14px
  font-family: "'Zpix', 'Press Start 2P', sans-serif"
  code-font-family: "'Zpix', 'Courier New', monospace"

# 加载动画
preloader:
  enable: true
  source: 1
  pace_css_url:

# 页面过渡
enter_transitions: true

# 默认模式
display_mode: light

# 图片灯箱
medium_zoom: false
fancybox: true

# PJAX
pjax:
  enable: true
  exclude:

# 图片懒加载
lazyload:
  enable: true
  field: site
  placeholder:
  blur: false

# PWA
pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

# Open Graph
Open_Graph_meta: true

# CDN 设置
CDN:
  # 主题内部文件
  main_css:
  main:
  utils:
  translate:
  local_search:
  algolia_js:
  algolia_search:
  instantsearch:
  pjax:
  gitalk:
  gitalk_css:
  blueimp_md5:
  valine:
  disqusjs:
  disqusjs_css:
  twikoo:
  waline_js:
  waline_css:
  sharejs:
  sharejs_css:
  mathjax:
  katex:
  katex_copytex:
  mermaid:
  canvas_ribbon:
  canvas_fluttering_ribbon:
  canvas_nest:
  lazyload:
  instantpage:
  typed:
  pangu:
  fancybox_css:
  fancybox:
  medium_zoom:
  snackbar_css:
  snackbar:
  activate_power_mode:
  fireworks:
  click_heart:
  ClickShowText:
  fontawesome:
  flickr_justified_gallery_js:
  flickr_justified_gallery_css:
  apple_touch_icon:
  aplayer_css:
  aplayer_js:
  meting_js:
  prismjs_js:
  prismjs_lineNumber_js:
  prismjs_autoloader:

# 音乐播放器配置
music_player:
  enable: true
  # 音频源: local / netease / both
  source: netease
  # 网易云歌单 ID（source 为 netease 或 both 时需要填写）
  netease_playlist_id: "6894709007"
  # 默认音量 0~1
  volume: 0.1
  # 是否自动播放
  autoplay: false
  # 播放顺序: list / random
  order: list

# 插入自定义 CSS 或 JS
inject:
  head:
    # 风格切换首屏状态：尽早设置 html[data-style]，减少换肤闪烁
    - |
      <script>
        (function () {
          var key = 'site_style_v1';
          var fallback = 'pixel';
          var allowed = ['pixel', 'vereis'];
          var style = fallback;
          try {
            var saved = localStorage.getItem(key);
            if (allowed.indexOf(saved) >= 0) style = saved;
          } catch (_) {}
          document.documentElement.dataset.style = style;
        })();
      </script>
    - <meta name="color-scheme" content="light dark">
    # 引入 custom.css (里面包含了字体和多彩云朵背景的样式)
    - <link rel="stylesheet" href="/css/custom.css">
    # 引入 NES.css 像素库
    - <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    # 风格预设覆盖层
    - <link rel="stylesheet" href="/css/theme-preset.css">
    # 音乐播放器默认配置
    - <meta name="music-default-source" content="netease">
    - <meta name="music-default-volume" content="0.1">
    - <meta name="music-autoplay-home" content="false">
    - <meta name="music-default-order" content="list">
    # 音乐播放器 - 传递网易云歌单 ID 到前端
    - <meta name="music-netease-id" content="6894709007">
    # 动态博客 API 基础路径（Cloudflare Pages + Worker）
    - <meta name="dynamic-api-base" content="https://api.yurisa.top/api/v1">
    # Turnstile 站点公钥（评论防刷）
    - <meta name="turnstile-site-key" content="">
    # Live2D 看板娘配置
    - <meta name="live2d-enabled" content="true">
    - <meta name="live2d-debug" content="false">
    - <meta name="live2d-tips-path" content="/live2d-widget/waifu-tips-yurisa.json">
    - <meta name="live2d-site-index-path" content="/search.xml">
    - <meta name="live2d-model-path" content="/live2d-widget/models/aphrodite/fense.model3.json">
    - <meta name="live2d-model-id" content="0">
    - <meta name="live2d-tools" content="assistant,model,search,random,progress,music,style,photo,quit">
    - <meta name="live2d-pixi-path" content="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js">
    - <meta name="live2d-pixi-live2d-path" content="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js">
    - <meta name="live2d-render-scale" content="1.5">
    - <meta name="live2d-max-fps" content="45">
    - <meta name="live2d-max-panel-posts" content="5">
    - <meta name="live2d-width" content="280">
    - <meta name="live2d-height" content="320">
    - <meta name="live2d-model-scale" content="2.4">
    - <meta name="live2d-model-x" content="0">
    - <meta name="live2d-model-y" content="135">
    - <meta name="live2d-position" content="right">
    - <meta name="live2d-right" content="96px">
    - <meta name="live2d-bottom" content="8px">
  bottom:
    # 1. 引入云朵背景JS (自动创建背景元素并检测页面类型)
    - <script src="/js/cloud-bg.js"></script>

    # 2. APlayer 音乐播放器 CDN 资源
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    - <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    - <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>

    # 3. Turnstile（评论防刷）
    - <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    # 4. 自定义音乐播放器（侧边抽屉 + rightside 入口）
    - <script src="/js/music-player.js"></script>

    # 5. 一键风格切换按钮
    - <script src="/js/style-switcher.js"></script>

    # 6. 动态博客前端脚本（评论/点赞/阅读量）
    - <script src="/js/dynamic-blog.js"></script>

    # 7. Live2D 看板娘（本地 widget dist + 博客桥接层）
    - <script src="/js/live2d-assistant.js"></script>
