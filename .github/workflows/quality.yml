name: Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - run: npm ci
      - run: npm --prefix worker ci
      - name: Install launch media tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run verify
      - name: Install critical browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:critical

  launch-visual:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Ensure launch media tooling
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install canonical visual browser
        run: npx playwright install chromium

      - name: Compare production WebGL against checked-in upstream references
        run: npm run test:e2e:visual

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-pr-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
