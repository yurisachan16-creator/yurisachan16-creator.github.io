name: Launch Experience Nightly

on:
  schedule:
    # 03:17 Asia/Shanghai, every day (GitHub cron is UTC).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    uses: ./.github/workflows/launch-release-gate.yml
    with:
      # Nightly verification must remain on the free/default Ubuntu path.
      run_macos_visual: false
