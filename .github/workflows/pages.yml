name: Build and Deploy (Cloudflare Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-release-gate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/launch-release-gate.yml

  build:
    if: github.ref == 'refs/heads/main'
    needs: launch-release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - run: npm ci
      - run: npm --prefix worker ci
      - run: npm run test:unit
      - run: npm run test:coverage:launch
      - run: npm run worker:typecheck

      - name: Install launch media tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-site
          path: public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name yurisachan16-creator-github-io --branch main
